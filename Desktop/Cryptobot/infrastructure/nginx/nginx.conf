server {
    listen 80;
    server_name tvh-ru.ru www.tvh-ru.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tvh-ru.ru www.tvh-ru.ru;

    ssl_certificate /etc/letsencrypt/live/tvh-ru.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tvh-ru.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # DeepSeek Harness (dsh) web UI; port 8443 is whitelisted in the SG.
    listen 8443 ssl;
    http2 on;
    server_name tvh-ru.ru;

    ssl_certificate /etc/letsencrypt/live/tvh-ru.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tvh-ru.ru/privkey.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://172.18.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
